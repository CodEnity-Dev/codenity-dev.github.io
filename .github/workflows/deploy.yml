name: Build and deploy Jekyll site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.7"

      - name: Install dependencies
        run: |
          gem install bundler --no-document
          bundle install

      - name: Build the site with Jekyll (explicit source/config)
        run: bundle exec jekyll build --source . --config _config.yml --destination ./_site

      - name: Deploy generated site to `gh-pages` branch using PAT
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false

name: Build and deploy Jekyll site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.7"

      - name: Install dependencies
        run: |
          gem install bundler --no-document
          bundle install

      - name: Build the site with Jekyll (explicit source/config)
        run: bundle exec jekyll build --source . --config _config.yml --destination ./_site

      - name: Deploy generated site to `gh-pages` branch using PAT
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false

      - name: Ensure GitHub Pages site is configured to use `gh-pages`
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Setting Pages source to gh-pages branch for $REPO"
          PAYLOAD=$(jq -n '{source: {branch: "gh-pages", path: "/"}}')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/$REPO/pages -d "$PAYLOAD")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Pages source updated (HTTP $STATUS)"
          else
            echo "Failed to update Pages source (HTTP $STATUS)" >&2
            exit 1
          fi

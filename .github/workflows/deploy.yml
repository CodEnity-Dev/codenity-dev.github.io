name: Build and publish Jekyll site into docs/ on main

on:
  push:
    branches: [main]
    # ignore pushes that only change the docs output to avoid loop
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install dependencies
        run: |
          gem install bundler --no-document
          bundle install

      - name: Build the site with Jekyll
        run: bundle exec jekyll build --destination ./_site

      - name: Copy built site to docs/
        run: |
          rm -rf docs || true
          mkdir -p docs
          cp -a _site/. docs/

      - name: Commit and push docs to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all docs
          if git diff --cached --quiet; then
            echo "No changes to docs — skipping commit"
          else
            git commit -m "chore(deploy): update site output [skip ci]"
            git push origin HEAD:main
          fi

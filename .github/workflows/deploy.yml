name: Build and deploy Jekyll site to gh-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JEKYLL_ENV: production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.7"
          bundler-cache: false
          working-directory: .jekyll

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('.jekyll/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        working-directory: .jekyll
        run: |
          gem install bundler --no-document
          bundle config path ../vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build the site with Jekyll (explicit source/config)
        working-directory: .jekyll
        run: |
          bundle exec jekyll build --source .. --config ../_config.yml --destination ../_site

      - name: Validate build output
        run: |
          echo "Checking build output..."
          ls -la _site/
          echo "Checking admin directory..."
          ls -la _site/admin/ || echo "Admin directory not found"

      - name: Deploy generated site to `gh-pages` branch using PAT
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy Jekyll site with CMS support [skip ci]"

      - name: Ensure GitHub Pages site is configured to use `gh-pages`
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Setting Pages source to gh-pages branch for $REPO"
          PAYLOAD=$(jq -n '{source: {branch: "gh-pages", path: "/"}}')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/$REPO/pages -d "$PAYLOAD")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Pages source updated (HTTP $STATUS)"
          else
            echo "Failed to update Pages source (HTTP $STATUS)" >&2
            exit 1
          fi

<div id="cookie-banner" class="cookie-banner" role="region" aria-label="Cookie consent" hidden>
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
    <div>
      <strong>We use cookies</strong>
      <p style="margin:.25rem 0 0 0;color:var(--color-muted);">We use analytics to improve the site. You can accept or manage preferences.</p>
    </div>
    <div style="display:flex;gap:.6rem;align-items:center;">
      <a class="btn" href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <button id="cookie-accept" class="btn btn-cta">Accept</button>
    </div>
  </div>
</div>

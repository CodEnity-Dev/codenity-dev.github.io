{%- assign meta_title = page.title | default: site.title -%}
{%- assign meta_desc = page.description | default: site.description -%}
{%- assign meta_url = site.url | append: site.baseurl | append: page.url -%}

<!-- Basic Meta -->
<meta name="description" content="{{ meta_desc }}">
<link rel="canonical" href="{{ meta_url }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ meta_title }}">
<meta property="og:description" content="{{ meta_desc }}">
<meta property="og:url" content="{{ meta_url }}">
<meta property="og:image" content="{{ '/assets/images/og-image.svg' | relative_url }}">
<meta property="og:type" content="website">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ meta_title }}">
<meta name="twitter:description" content="{{ meta_desc }}">
<meta name="twitter:image" content="{{ '/assets/images/og-image.svg' | relative_url }}">

<!-- JSON-LD Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "logo": "{{ '/assets/images/ce.png' | relative_url }}"
}
</script>

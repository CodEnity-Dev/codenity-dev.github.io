<a class="store-badge" href="{{ include.url }}" target="_blank" rel="noopener">
  <span class="store-icon" aria-hidden="true">
    {% if include.platform == "Google Play" %}
      <svg width="20" height="20" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M325 256L104 431c-8 6-21 1-21-10V91c0-11 13-16 21-10L325 256z" fill="#3DDC84"/></svg>
    {% elsif include.platform == "Chrome Web Store" %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#4285F4"/></svg>
    {% elsif include.platform == "Mozilla Add-ons" %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="3" fill="#FF7139"/></svg>
    {% elsif include.platform == "Edge Add-ons" %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12c0-5.5 4.5-10 10-10h8v8c0 5.5-4.5 10-10 10H2v-8z" fill="#0078D7"/></svg>
    {% else %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#94A3B8"/></svg>
    {% endif %}
  </span>
  <span class="store-label">{{ include.platform }}</span>
</a>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1E3A8A, #3B82F6);
      color: white;
    }
    
    .callback-container {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      color: #ff6b6b;
      background: rgba(255,107,107,0.1);
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="callback-container">
    <h2>Processing Authentication...</h2>
    <div class="spinner"></div>
    <p id="status">Completing GitHub authentication...</p>
    <div id="error" class="error" style="display: none;"></div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      
      if (error) {
        document.getElementById('status').style.display = 'none';
        document.querySelector('.spinner').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = `Authentication failed: ${error}`;
        return;
      }
      
      if (!code) {
        document.getElementById('status').style.display = 'none';
        document.querySelector('.spinner').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'No authorization code received from GitHub';
        return;
      }
      
      // For Netlify Identity or similar service
      // This would typically make a request to exchange the code for a token
      // But for GitHub Pages + Decap CMS, we need to use netlify-cms-github-oauth-provider
      
      // Store the code temporarily and redirect to admin
      try {
        // Pass the auth code back to the CMS
        if (window.opener) {
          window.opener.postMessage({
            type: 'authorization-github',
            token: code
          }, window.location.origin);
          window.close();
        } else {
          // Fallback: store code and redirect
          sessionStorage.setItem('github-auth-code', code);
          setTimeout(() => {
            window.location.href = '/admin/';
          }, 2000);
        }
      } catch (err) {
        document.getElementById('status').style.display = 'none';
        document.querySelector('.spinner').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Error processing authentication: ' + err.message;
      }
    })();
  </script>
</body>
</html>

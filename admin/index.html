<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CodEnity Blog Admin</title>
  <link rel="icon" href="../assets/images/ce.png" type="image/png">
  
  <!-- Decap CMS Styles -->
  <style>
    /* Custom admin styles */
    .nc-app-header {
      background: linear-gradient(135deg, #1E3A8A, #3B82F6) !important;
    }
    
    .nc-app-header h1 {
      color: white !important;
    }
    
    .nc-entryEditor-widget-markdown .nc-controlPane-widget {
      min-height: 400px;
    }
    
    /* Loading screen */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1E3A8A, #3B82F6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 12px;
    }
    
    .loading-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .loading-subtitle {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 30px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Hide loading when CMS loads */
    .nc-app-loaded .loading-container {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-container" id="loading">
    <img src="../assets/images/ce.png" alt="CodEnity" class="loading-logo">
    <div class="loading-title">CodEnity Blog Admin</div>
    <div class="loading-subtitle">Loading content management system...</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- GitHub OAuth setup -->
  <script>
    // Set up GitHub OAuth for GitHub Pages
    if (window.location.hostname !== 'localhost') {
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'codenity-dev/codenity-dev.github.io',
          branch: 'main'
        }
      };
    }
  </script>
  
  <script>
    // Custom configuration and initialization
    window.addEventListener('load', function() {
      // Hide loading screen when CMS is ready
      setTimeout(function() {
        document.body.classList.add('nc-app-loaded');
      }, 2000);
      
      // Custom CMS configuration
      if (window.CMS) {
        // Register custom preview templates
        CMS.registerPreviewTemplate('posts', PostPreview);
        
        // Custom editor components if needed
        CMS.registerEditorComponent({
          id: "youtube",
          label: "YouTube",
          fields: [{
            name: 'id', 
            label: 'YouTube Video ID', 
            widget: 'string'
          }],
          pattern: /^{{< youtube ([a-zA-Z0-9_-]+) >}}$/,
          fromBlock: function(match) {
            return {
              id: match[1]
            };
          },
          toBlock: function(obj) {
            return `{{< youtube ${obj.id} >}}`;
          },
          toPreview: function(obj) {
            return `<iframe width="560" height="315" src="https://www.youtube.com/embed/${obj.id}" frameborder="0" allowfullscreen></iframe>`;
          }
        });
        
        // Code block component
        CMS.registerEditorComponent({
          id: "code",
          label: "Code Block",
          fields: [
            {name: 'lang', label: 'Language', widget: 'string', default: 'javascript'},
            {name: 'code', label: 'Code', widget: 'text'}
          ],
          pattern: /^```(\w+)?\n(.*?)\n```$/ms,
          fromBlock: function(match) {
            return {
              lang: match[1] || 'text',
              code: match[2]
            };
          },
          toBlock: function(obj) {
            return `\`\`\`${obj.lang}\n${obj.code}\n\`\`\``;
          },
          toPreview: function(obj) {
            return `<pre><code class="language-${obj.lang}">${obj.code}</code></pre>`;
          }
        });
      }
    });
    
    // Post Preview Component
    var PostPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var image = entry.getIn(['data', 'image']);
        var title = entry.getIn(['data', 'title']);
        var body = this.props.widgetFor('body');
        var description = entry.getIn(['data', 'description']);
        var categories = entry.getIn(['data', 'categories']);
        var tags = entry.getIn(['data', 'tags']);
        var date = entry.getIn(['data', 'date']);
        var readTime = entry.getIn(['data', 'read_time']);
        
        return h('div', {className: "post-preview"},
          h('div', {className: "post-preview-header"},
            image ? h('img', {src: image, className: "preview-image"}) : null,
            h('h1', {className: "preview-title"}, title),
            h('div', {className: "preview-meta"},
              h('time', {}, date ? new Date(date).toLocaleDateString() : ''),
              readTime ? h('span', {}, ' • ' + readTime + ' min read') : null
            ),
            description ? h('p', {className: "preview-description"}, description) : null,
            h('div', {className: "preview-categories"},
              categories ? categories.map(function(cat, i) {
                return h('span', {key: i, className: "category-tag"}, cat);
              }) : null
            ),
            h('div', {className: "preview-tags"},
              tags ? tags.map(function(tag, i) {
                return h('span', {key: i, className: "tag-pill"}, '#' + tag);
              }) : null
            )
          ),
          h('div', {className: "preview-content"}, body)
        );
      }
    });
    
    // Performance monitoring
    if ('performance' in window) {
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
          console.log('CMS Load Time: ' + loadTime + 'ms');
        }, 0);
      });
    }
  </script>
  
  <style>
    /* Preview Styles */
    .post-preview {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    
    .post-preview-header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e5e5;
    }
    
    .preview-image {
      width: 100%;
      max-width: 600px;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .preview-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #1E3A8A;
      margin-bottom: 15px;
      line-height: 1.2;
    }
    
    .preview-meta {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    
    .preview-description {
      font-size: 1.1rem;
      color: #4b5563;
      margin-bottom: 20px;
      font-style: italic;
    }
    
    .preview-categories {
      margin-bottom: 10px;
    }
    
    .category-tag {
      background: #1E3A8A;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 0.5rem;
    }
    
    .preview-tags {
      margin-bottom: 20px;
    }
    
    .tag-pill {
      background: #f3f4f6;
      color: #6b7280;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      display: inline-block;
    }
    
    .preview-content {
      color: #374151;
    }
    
    .preview-content h2 {
      color: #1E3A8A;
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    
    .preview-content h3 {
      color: #1f2937;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }
    
    .preview-content code {
      background: #f3f4f6;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-size: 0.875rem;
    }
    
    .preview-content pre {
      background: #1f2937;
      color: #f9fafb;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
    }
    
    .preview-content pre code {
      background: none;
      padding: 0;
      color: inherit;
    }
  </style>
</body>
</html>

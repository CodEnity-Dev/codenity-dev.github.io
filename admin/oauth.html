<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub OAuth</title>
  <script>
    // GitHub OAuth callback handler for Decap CMS
    (function() {
      function getParameterByName(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
            results = regex.exec(location.search);
        return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
      }

      var error = getParameterByName('error');
      if (error) {
        alert('Error: ' + getParameterByName('error_description'));
        return;
      }

      var code = getParameterByName('code');
      if (code) {
        // This would normally send the code to your auth service
        // For GitHub Pages, we'll use a workaround with personal access tokens
        
        window.opener.postMessage({
          type: 'authorization_github',
          payload: {
            provider: 'github',
            token: code // This will be the authorization code
          }
        }, window.location.origin);
        
        window.close();
      }
    })();
  </script>
</head>
<body>
  <p>Authorizing...</p>
</body>
</html>

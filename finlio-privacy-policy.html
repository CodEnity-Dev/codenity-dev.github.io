<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/finlio/privacy-policy.html">
    <link rel="canonical" href="/finlio/privacy-policy.html">
    <title>Finlio Privacy Policy - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .redirect-message {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
    <script>
        // Fallback JavaScript redirect
        window.location.replace("/finlio/privacy-policy.html");
    </script>
</head>
<body>
    <div class="redirect-message">
        <h1>💰 Finlio Privacy Policy</h1>
        <div class="spinner"></div>
        <p>Redirecting you to the privacy policy...</p>
        <p><a href="/finlio/privacy-policy.html">Click here if not redirected automatically</a></p>
    </div>
</body>
</html>

# Netlify configuration for serverless functions only
# GitHub Pages handles Jekyll site building
[build]
  base = "."
  publish = "netlify/functions"
  command = "npm install --production"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Serverless Functions Configuration
[functions]
  directory = "netlify/functions"

# Redirect rules for OAuth flow
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = false

# Finlio documentation redirects
[[redirects]]
  from = "/finlio-privacy-policy.html"
  to = "/finlio/privacy-policy.html"
  status = 301
  force = false

[[redirects]]
  from = "/finlio-terms-of-service.html"
  to = "/finlio/terms-of-service.html"
  status = 301
  force = false

# Environment variables (set these in Netlify UI)
# Required:
# - GITHUB_CLIENT_ID: Your GitHub OAuth app client ID
# - GITHUB_CLIENT_SECRET: Your GitHub OAuth app client secret  
# - ORIGIN: https://codenity-dev.github.io

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
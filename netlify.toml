# Netlify configuration for GitHub Pages CMS authentication
# This only deploys serverless functions - GitHub Pages builds the Jekyll site
[build]
  base = "."
  publish = "."
  command = "npm install --production"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  BUNDLE_GEMFILE = "/dev/null"
  SKIP_BUNDLER_INSTALL = "true"

# Serverless Functions Configuration
[functions]
  directory = "netlify/functions"

# Redirect rules for OAuth flow
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = false

# Environment variables (set these in Netlify UI)
# Required:
# - GITHUB_CLIENT_ID: Your GitHub OAuth app client ID
# - GITHUB_CLIENT_SECRET: Your GitHub OAuth app client secret  
# - ORIGIN: https://codenity-dev.github.io

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"